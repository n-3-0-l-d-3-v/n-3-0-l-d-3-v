<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000"
     fill="none" role="img"
     aria-label="Neil Thomas Mathew — systems, security and AI infrastructure."
     font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">
<defs>
  <radialGradient id="bloomN" cx="50%" cy="27%" r="55%">
    <stop offset="0%"   stop-color="#3a3f5c" stop-opacity=".38"/>
    <stop offset="45%"  stop-color="#16161f" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="coreN" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#c9a88a" stop-opacity=".55"/>
    <stop offset="60%"  stop-color="#c9a88a" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#c9a88a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="horizonN" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#3a3f5c" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#3a3f5c" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#3a3f5c" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="streamN" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#a8b4c8" stop-opacity="0"/>
    <stop offset="55%"  stop-color="#a8b4c8" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#a8b4c8" stop-opacity="0"/>
  </linearGradient>
</defs>

<style>
/* Narrow cut of the same film: tighter framing, simplified secondary
   geometry, identical palette, sequence and mascot. */
.void{fill:#050508} .form{fill:#16161f} .sec{fill:#3a3f5c}
.light{fill:#a8b4c8} .warm{fill:#c9a88a}
.lineS{stroke:#3a3f5c;fill:none} .lineL{stroke:#a8b4c8;fill:none}

.name {font-size:38px; font-weight:300; letter-spacing:9px;  fill:#e8e6e3}
.role {font-size:13px; letter-spacing:6px;   fill:#a8b4c8; opacity:.72}
.insc {font-size:13px; letter-spacing:3px;   fill:#a8b4c8; opacity:.80}
.insc2{font-size:11px; letter-spacing:2px;   fill:#3a3f5c}
.minor{font-size:10px; letter-spacing:2px;   fill:#3a3f5c; opacity:.85}
.stack{font-size:11px; letter-spacing:2.4px; fill:#a8b4c8; opacity:.60}
.chTtl{font-size:13px; letter-spacing:2px;   fill:#e8e6e3}
.chDsc{font-size:10px; letter-spacing:.6px;  fill:#a8b4c8; opacity:.60}
.chSt {font-size:9px;  letter-spacing:1.6px; fill:#3a3f5c}
.edge {font-size:9px;  letter-spacing:2px;   fill:#3a3f5c; opacity:.60}

.cue{opacity:0; animation:rise 1.6s cubic-bezier(.16,1,.3,1) forwards;
     animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:var(--len,900); stroke-dashoffset:var(--len,900);
      animation:draw 3.4s cubic-bezier(.16,1,.3,1) forwards; animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
#etchN rect{width:0; animation:etch 3.2s cubic-bezier(.16,1,.3,1) forwards; animation-delay:15s}
@keyframes etch{to{width:660px}}

.p{animation:drift linear infinite; transform-box:fill-box}
@keyframes drift{0%{transform:translate(0,0);opacity:0} 14%{opacity:.5}
                 86%{opacity:.5} 100%{transform:translate(18px,-160px);opacity:0}}
#bloomN{opacity:0; animation:fadeIn 6s ease-out 1.2s forwards}
@keyframes fadeIn{to{opacity:1}}

/* The Fold — identical behaviour, smaller stage */
#foldN{opacity:0; animation:fadeIn 2.6s ease-out 5s forwards}
.blade{transform-box:fill-box; transform-origin:50% 100%;
       transform:scale(.14) rotate(-34deg);
       animation:unfold 5.4s cubic-bezier(.16,1,.3,1) forwards,
                 shift 26s ease-in-out 15s infinite;
       animation-delay:var(--d,6s), 15s}
@keyframes unfold{to{transform:scale(1) rotate(0deg)}}
@keyframes shift {0%,100%{transform:scale(1) rotate(0deg)}
                  28%{transform:scale(.965) rotate(-3.2deg)}
                  56%{transform:scale(1.05) rotate(2.4deg)}
                  80%{transform:scale(.99) rotate(-1.2deg)}}
#foldTurnN{transform-box:view-box; transform-origin:360px 250px;
           animation:turn 240s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
#coreN{opacity:0; animation:fadeIn 4s ease-out 8s forwards,
                            breathe 7s ease-in-out 12s infinite}
@keyframes breathe{0%,100%{opacity:1} 50%{opacity:.62}}

/* atmosphere: running cadence + music waveform, light only */
#cadenceN{opacity:0; animation:fadeIn 5s ease-out 16s forwards,
                                cadence 1.9s ease-in-out 18s infinite}
@keyframes cadence{0%{opacity:.30} 8%{opacity:.85} 26%{opacity:.34}
                   50%{opacity:.30} 58%{opacity:.62} 76%{opacity:.30} 100%{opacity:.30}}
.wv{transform-box:fill-box; transform-origin:50% 100%; transform:scaleY(.1);
    animation:wave 3.1s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes wave{0%,100%{transform:scaleY(.10)} 25%{transform:scaleY(.85)}
                50%{transform:scaleY(.28)} 75%{transform:scaleY(.62)}}
#waveN{opacity:0; animation:fadeIn 6s ease-out 19s forwards}

.flow{stroke:url(#streamN); stroke-width:1.2; fill:none;
      stroke-dasharray:180 720; stroke-dashoffset:900; opacity:0;
      animation:fadeIn 4s ease-out forwards, flowRun 14s linear infinite;
      animation-delay:var(--d,30s), var(--d,30s)}
@keyframes flowRun{to{stroke-dashoffset:-900}}

.chamber{opacity:0; animation:rise 2s cubic-bezier(.16,1,.3,1) forwards,
                              focus 42s ease-in-out infinite;
         animation-delay:var(--d,49s), calc(var(--d,49s) + 9s)}
@keyframes focus{0%,100%{opacity:.46} 6%,12%{opacity:1} 20%{opacity:.46}}
.mark{animation:markPulse 42s ease-in-out infinite;
      animation-delay:calc(var(--d,49s) + 9s)}
@keyframes markPulse{0%,100%{fill:#3a3f5c} 6%,12%{fill:#c9a88a} 20%{fill:#3a3f5c}}

@media (prefers-reduced-motion: reduce){
  *,::before,::after{animation:none !important}
  .cue,#foldN,#bloomN,#coreN,#cadenceN,#waveN,.chamber,.flow{opacity:1}
  .blade{transform:scale(1) rotate(0)} .draw{stroke-dashoffset:0}
  .wv{transform:scaleY(1)} #etchN rect{width:660px}
}
</style>

<rect class="void" x="0" y="0" width="720" height="1000"/>
<g id="bloomN"><rect x="0" y="0" width="720" height="1000" fill="url(#bloomN)"/></g>

<!-- simplified drift: fewer motes than the wide cut -->
<g class="light" opacity=".55">
  <circle class="p" cx="90"  cy="880" r="1.1" style="animation-duration:46s;animation-delay:0s"/>
  <circle class="p" cx="250" cy="940" r="0.9" style="animation-duration:58s;animation-delay:5s"/>
  <circle class="p" cx="430" cy="900" r="1.2" style="animation-duration:52s;animation-delay:11s"/>
  <circle class="p" cx="620" cy="860" r="1.0" style="animation-duration:64s;animation-delay:3s"/>
  <circle class="p" cx="150" cy="640" r="1.0" style="animation-duration:56s;animation-delay:17s"/>
  <circle class="p" cx="560" cy="600" r="0.9" style="animation-duration:68s;animation-delay:9s"/>
  <circle class="p" cx="340" cy="500" r="1.1" style="animation-duration:50s;animation-delay:23s"/>
  <circle class="p" cx="660" cy="420" r="0.8" style="animation-duration:62s;animation-delay:14s"/>
</g>

<!-- simplified architecture: two strata, two struts -->
<g class="lineS" stroke-width="1">
  <path class="draw" d="M0 108 H720"  style="--len:720;--d:8.4s"  opacity=".5"/>
  <path class="draw" d="M0 176 H720"  style="--len:720;--d:9.2s"  opacity=".3"/>
  <path class="draw" d="M0 626 H720"  style="--len:720;--d:9.8s"  opacity=".45"/>
  <path class="draw" d="M64 60 V900"  style="--len:840;--d:10.6s" opacity=".22"/>
  <path class="draw" d="M656 60 V900" style="--len:840;--d:10.6s" opacity=".22"/>
</g>
<rect x="0" y="625" width="720" height="1.4" fill="url(#horizonN)" class="cue" style="--d:9.8s"/>
<g id="cadenceN"><rect x="0" y="106" width="720" height="2.4" fill="url(#horizonN)" opacity=".5"/></g>

<g>
  <path class="flow" d="M0 108 H720" style="--d:30s"/>
  <path class="flow" d="M0 626 H720" style="--d:36s"/>
</g>

<!-- ══ THE FOLD ══ -->
<g id="foldN">
  <g id="foldTurnN">
    <g transform="translate(360,250)">
      <ellipse id="coreN" cx="0" cy="0" rx="130" ry="130" fill="url(#coreN)"/>
      <g class="lineL" stroke-width="1" opacity=".55">
        <g transform="rotate(0)">   <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:6.0s"/></g>
        <g transform="rotate(45)">  <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:6.3s"/></g>
        <g transform="rotate(90)">  <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:6.6s"/></g>
        <g transform="rotate(135)"> <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:6.9s"/></g>
        <g transform="rotate(180)"> <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:7.2s"/></g>
        <g transform="rotate(225)"> <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:7.5s"/></g>
        <g transform="rotate(270)"> <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:7.8s"/></g>
        <g transform="rotate(315)"> <path class="blade" d="M0 0 L18 -48 L0 -146 L-18 -48 Z" style="--d:8.1s"/></g>
      </g>
      <circle class="lineS cue" cx="0" cy="0" r="54" stroke-width="1" opacity=".45" style="--d:12.4s"/>
      <g transform="rotate(45)"><rect class="warm cue" x="-4" y="-4" width="8" height="8" opacity=".9" style="--d:12.8s"/></g>
    </g>
  </g>
</g>

<!-- ══ STACK on the upper structure ══ -->
<g class="stack">
  <text class="cue" x="360" y="64" text-anchor="middle" style="--d:29.4s">TYPESCRIPT &#8942; PYTHON &#8942; SQL</text>
  <text class="cue" x="360" y="86" text-anchor="middle" style="--d:30.6s">NEXT.JS &#8942; REACT &#8942; NODE &#8942; PRISMA</text>
  <text class="cue" x="360" y="596" text-anchor="middle" style="--d:31.8s">POSTGRES &#8942; SUPABASE &#8942; DOCKER</text>
  <text class="cue" x="360" y="616" text-anchor="middle" style="--d:33.0s">OPENAI &#8942; GEMINI &#8942; OPENCV &#8942; VERCEL</text>
</g>

<!-- ══ IDENTITY ══ -->
<clipPath id="etchN"><rect x="30" y="430" width="0" height="42"/></clipPath>
<text class="name" x="360" y="462" text-anchor="middle" clip-path="url(#etchN)">NEIL THOMAS</text>
<text class="name cue" x="360" y="508" text-anchor="middle" style="--d:17.4s">MATHEW</text>
<text class="role cue"  x="360" y="540" text-anchor="middle" style="--d:18.4s">CS MAJOR &#183; BANGALORE</text>
<text class="insc cue"  x="360" y="672" text-anchor="middle" style="--d:20.2s">SYSTEMS &#183; SECURITY &#183; AI INFRASTRUCTURE</text>
<text class="insc2 cue" x="360" y="694" text-anchor="middle" style="--d:23.4s">EVERY FINDING A STRUCTURED CLAIM</text>
<text class="minor cue" x="360" y="714" text-anchor="middle" style="--d:26.6s" opacity=".55">and a platform for game developers to ship together</text>

<!-- ══ WAVEFORM ══ -->
<g id="waveN" class="sec" opacity=".22">
  <g transform="translate(298,968)">
    <rect class="wv" x="0"  y="-11" width="1.6" height="11" style="--d:0.0s"/>
    <rect class="wv" x="7"  y="-11" width="1.6" height="11" style="--d:0.3s"/>
    <rect class="wv" x="14" y="-11" width="1.6" height="11" style="--d:0.6s"/>
    <rect class="wv" x="21" y="-11" width="1.6" height="11" style="--d:0.9s"/>
    <rect class="wv" x="28" y="-11" width="1.6" height="11" style="--d:1.2s"/>
    <rect class="wv" x="35" y="-11" width="1.6" height="11" style="--d:1.5s"/>
    <rect class="wv" x="42" y="-11" width="1.6" height="11" style="--d:1.8s"/>
    <rect class="wv" x="49" y="-11" width="1.6" height="11" style="--d:2.1s"/>
    <rect class="wv" x="56" y="-11" width="1.6" height="11" style="--d:2.4s"/>
    <rect class="wv" x="63" y="-11" width="1.6" height="11" style="--d:2.7s"/>
    <rect class="wv" x="70" y="-11" width="1.6" height="11" style="--d:1.1s"/>
    <rect class="wv" x="77" y="-11" width="1.6" height="11" style="--d:0.5s"/>
    <rect class="wv" x="84" y="-11" width="1.6" height="11" style="--d:1.9s"/>
    <rect class="wv" x="91" y="-11" width="1.6" height="11" style="--d:0.8s"/>
    <rect class="wv" x="98" y="-11" width="1.6" height="11" style="--d:2.3s"/>
    <rect class="wv" x="105" y="-11" width="1.6" height="11" style="--d:1.4s"/>
    <rect class="wv" x="112" y="-11" width="1.6" height="11" style="--d:0.2s"/>
    <rect class="wv" x="119" y="-11" width="1.6" height="11" style="--d:2.6s"/>
  </g>
</g>

<!-- ══ CHAMBERS — four on narrow, stacked ══ -->
<g>
  <g transform="translate(64,740)"><g class="chamber" style="--d:49.0s">
    <rect class="form" x="0" y="0" width="592" height="46" rx="1"/>
    <path class="lineS" d="M0 0 H592 M0 46 H592" stroke-width="1" opacity=".5"/>
    <path class="lineL" d="M0 0 V46" stroke-width="1.4" opacity=".5"/>
    <text class="chTtl" x="16" y="20">AETHER-PLATFORM</text>
    <text class="chSt"  x="576" y="20" text-anchor="end">ACTIVE</text>
    <text class="chDsc" x="16" y="36">Evidence-first firmware analysis on Ghidra</text>
    <rect class="mark" style="--d:49.0s" x="572" y="30" width="4" height="4"/>
  </g></g>

  <g transform="translate(64,794)"><g class="chamber" style="--d:50.4s">
    <rect class="form" x="0" y="0" width="592" height="46" rx="1"/>
    <path class="lineS" d="M0 0 H592 M0 46 H592" stroke-width="1" opacity=".5"/>
    <path class="lineL" d="M0 0 V46" stroke-width="1.4" opacity=".5"/>
    <text class="chTtl" x="16" y="20">OVERLOAD-CUSP</text>
    <text class="chSt"  x="576" y="20" text-anchor="end">IEEE ARTEFACT</text>
    <text class="chDsc" x="16" y="36">Cusp-catastrophe model of overload</text>
    <rect class="mark" style="--d:50.4s" x="572" y="30" width="4" height="4"/>
  </g></g>

  <g transform="translate(64,848)"><g class="chamber" style="--d:51.8s">
    <rect class="form" x="0" y="0" width="592" height="46" rx="1"/>
    <path class="lineS" d="M0 0 H592 M0 46 H592" stroke-width="1" opacity=".5"/>
    <path class="lineL" d="M0 0 V46" stroke-width="1.4" opacity=".5"/>
    <text class="chTtl" x="16" y="20">RECOUP</text>
    <text class="chSt"  x="576" y="20" text-anchor="end">BUILDATHON</text>
    <text class="chDsc" x="16" y="36">Policy-gated payment recovery plane</text>
    <rect class="mark" style="--d:51.8s" x="572" y="30" width="4" height="4"/>
  </g></g>

  <g transform="translate(64,902)"><g class="chamber" style="--d:53.2s">
    <rect class="form" x="0" y="0" width="592" height="46" rx="1"/>
    <path class="lineS" d="M0 0 H592 M0 46 H592" stroke-width="1" opacity=".5"/>
    <path class="lineL" d="M0 0 V46" stroke-width="1.4" opacity=".5"/>
    <text class="chTtl" x="16" y="20">QUERO</text>
    <text class="chSt"  x="576" y="20" text-anchor="end">ACTIVE</text>
    <text class="chDsc" x="16" y="36">Agentic email client, streaming AI</text>
    <rect class="mark" style="--d:53.2s" x="572" y="30" width="4" height="4"/>
  </g></g>
</g>

<!-- contact, held at the extreme edge -->
<text class="edge cue" x="16"  y="986" style="--d:72s">NEILTHOMASMATHEW.VERCEL.APP</text>
<text class="edge cue" x="704" y="986" text-anchor="end" style="--d:72s">GITHUB.COM/N-3-0-L-D-3-V</text>
</svg>
