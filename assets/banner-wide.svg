<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" fill="none" role="img" aria-label="Neil Thomas Mathew — systems, security, AI">
  <style>
    :root { color-scheme: light dark; }
    .name {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 44px; font-weight: 600; letter-spacing: 1.5px; fill: #1f2328;
    }
    .sub {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 14px; font-weight: 400; letter-spacing: 2.4px; fill: #6a737d;
    }
    .edge { stroke: #d0d7de; stroke-width: 1.25; }
    .node { fill: #58a6ff; }
    .halo { fill: #58a6ff; opacity: 0; }
    .rule { stroke: #58a6ff; stroke-width: 1.5; }
    .cursor { fill: #58a6ff; }

    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3; }
      .sub  { fill: #8b949e; }
      .edge { stroke: #30363d; }
    }

    #wipe rect { animation: wipe 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes wipe { from { width: 0; } to { width: 640px; } }

    .sub { opacity: 0; animation: rise .7s ease-out .75s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: .95; transform: translateY(0); } }

    .rule { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 1.2s cubic-bezier(.22,1,.36,1) .35s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .edge { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .9s ease-out forwards; }
    .e1 { animation-delay: .55s } .e2 { animation-delay: .65s } .e3 { animation-delay: .75s }
    .e4 { animation-delay: .85s } .e5 { animation-delay: .95s } .e6 { animation-delay: 1.05s }
    .e7 { animation-delay: 1.15s } .e8 { animation-delay: 1.25s }

    .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34,1.56,.64,1) forwards, breathe 3.4s ease-in-out infinite; }
    @keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
    .n1 { animation-delay: .9s, 2.0s } .n2 { animation-delay: 1.0s, 2.3s } .n3 { animation-delay: 1.1s, 2.6s }
    .n4 { animation-delay: 1.2s, 2.9s } .n5 { animation-delay: 1.3s, 3.2s } .n6 { animation-delay: 1.4s, 3.5s }

    .halo { transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out 2.2s infinite; }
    @keyframes ping { 0% { opacity: .5; transform: scale(1) } 70%,100% { opacity: 0; transform: scale(4.5) } }

    .cursor { opacity: 0; animation: blink 1.15s steps(1) 1.5s infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      #wipe rect, .sub, .rule, .edge, .node, .halo, .cursor { animation: none; }
      #wipe rect { width: 640px; } .sub { opacity: .95; }
      .rule, .edge { stroke-dashoffset: 0; } .node { opacity: 1; } .cursor { opacity: 1; }
    }
  </style>

  <clipPath id="wipe"><rect x="40" y="40" width="0" height="70"/></clipPath>

  <text class="name" x="40" y="92" clip-path="url(#wipe)">neil thomas mathew</text>
  <rect class="cursor" x="556" y="62" width="13" height="34" rx="1.5"/>

  <path class="rule" d="M40 118 H660"/>
  <text class="sub" x="41" y="146">SYSTEMS &#183; SECURITY &#183; AI &#183; BANGALORE</text>

  <g transform="translate(0,0)">
    <path class="edge e1" d="M720 100 L790 52"/>
    <path class="edge e2" d="M720 100 L790 148"/>
    <path class="edge e3" d="M790 52 L790 148"/>
    <path class="edge e4" d="M790 52 L866 74"/>
    <path class="edge e5" d="M790 148 L866 126"/>
    <path class="edge e6" d="M866 74 L866 126"/>
    <path class="edge e7" d="M866 74 L938 100"/>
    <path class="edge e8" d="M866 126 L938 100"/>

    <circle class="halo" cx="938" cy="100" r="4.5"/>
    <circle class="node n1" cx="720" cy="100" r="4.5"/>
    <circle class="node n2" cx="790" cy="52"  r="4.5"/>
    <circle class="node n3" cx="790" cy="148" r="4.5"/>
    <circle class="node n4" cx="866" cy="74"  r="4.5"/>
    <circle class="node n5" cx="866" cy="126" r="4.5"/>
    <circle class="node n6" cx="938" cy="100" r="5.5"/>
  </g>
</svg>
