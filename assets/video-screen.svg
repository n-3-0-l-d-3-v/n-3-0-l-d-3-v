<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"
     fill="none" role="img" aria-label="Video placeholder, terminal-style window, 16:9">
<defs>
  <clipPath id="winClip">
    <rect x="20" y="20" width="960" height="580" rx="14"/>
  </clipPath>
  <filter id="ambient" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>

<style>
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) {
  .blink { animation: none; opacity: .6 }
}
</style>

<!-- ambient glow, outside the frame -->
<rect x="20" y="20" width="960" height="580" rx="14" fill="#a8b4c8" opacity=".05" filter="url(#ambient)"/>

<!-- corner brackets, outside the frame -->
<g stroke="#a8b4c8" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="square">
  <path d="M12,30 L12,12 L30,12"/>
  <path d="M970,12 L988,12 L988,30"/>
  <path d="M12,590 L12,608 L30,608"/>
  <path d="M970,608 L988,608 L988,590"/>
</g>

<!-- window: title bar colour, body punched out on top -->
<rect x="20" y="20" width="960" height="580" rx="14" fill="#0c0c14" stroke="#3a3f5c" stroke-width="1.5"/>
<rect x="20" y="64" width="960" height="536" fill="#050508" clip-path="url(#winClip)"/>
<line x1="20" y1="64.5" x2="980" y2="64.5" stroke="#3a3f5c" stroke-width="1"/>

<!-- title bar controls -->
<circle cx="40" cy="42" r="4" fill="#a8b4c8" opacity=".85"/>
<circle cx="56" cy="42" r="4" fill="#a8b4c8" opacity=".55"/>
<circle cx="72" cy="42" r="4" fill="#a8b4c8" opacity=".3"/>

<!-- prompt -->
<text x="96" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#a8b4c8" opacity=".85">guest@neil:~$</text>
<rect class="blink" x="212" y="34" width="8" height="16" fill="#a8b4c8"/>

<!-- caption, outside the frame -->
<text x="500" y="636" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#3a3f5c">// 16:9 · awaiting feed</text>
</svg>
