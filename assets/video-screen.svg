<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"
     fill="none" role="img" aria-label="Video placeholder screen, 16:9">
<defs>
  <linearGradient id="bezelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161623"/>
    <stop offset="1" stop-color="#0a0a11"/>
  </linearGradient>
  <radialGradient id="screenGlow" cx="50%" cy="50%" r="72%">
    <stop offset="0" stop-color="#12131e"/>
    <stop offset="55%" stop-color="#07070c"/>
    <stop offset="100%" stop-color="#030305"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity=".05"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="screenClip">
    <rect x="36" y="36" width="928" height="508" rx="12"/>
  </clipPath>
  <filter id="ambient" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>

<style>
.pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; opacity: .85 }
}
</style>

<!-- ambient glow behind the device -->
<rect x="20" y="20" width="960" height="540" rx="20" fill="#a8b4c8" opacity=".07" filter="url(#ambient)"/>

<!-- bezel -->
<rect x="20" y="20" width="960" height="540" rx="20" fill="url(#bezelGrad)" stroke="#3a3f5c" stroke-width="1.5"/>

<!-- camera dot -->
<circle cx="500" cy="28" r="5" fill="none" stroke="#3a3f5c" stroke-width="1"/>
<circle cx="500" cy="28" r="2" fill="#3a3f5c"/>

<!-- screen -->
<rect x="36" y="36" width="928" height="508" rx="12" fill="url(#screenGlow)"/>

<g clip-path="url(#screenClip)">
  <rect x="260" y="-120" width="220" height="820" fill="url(#sheen)" transform="rotate(18 500 290)"/>

  <!-- play control -->
  <circle class="pulse" cx="500" cy="284" r="44" fill="#a8b4c8" opacity=".12" filter="url(#softGlow)"/>
  <circle cx="500" cy="284" r="38" fill="none" stroke="#a8b4c8" stroke-opacity=".3" stroke-width="1.3"/>
  <polygon class="pulse" points="488,266 488,302 518,284" fill="#a8b4c8"/>

  <!-- scrubber -->
  <line x1="76" y1="494" x2="924" y2="494" stroke="#3a3f5c" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="494" x2="232" y2="494" stroke="#a8b4c8" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  <circle cx="232" cy="494" r="4.5" fill="#a8b4c8"/>
</g>
</svg>
